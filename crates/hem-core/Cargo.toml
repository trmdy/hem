[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", features = [
    "block2",
    "LABiometryType",
    "LAContext",
    "LAError",
] }

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "2"
members = [
  "crates/valhall-auth",
  "crates/valhall-config",
  "crates/valhall-events",
  "crates/valhall-net",
  "crates/bod",
  "crates/bod-core",
  "crates/bodd",
  "crates/skip",
  "crates/skip-core",
  "crates/skipd",
  "crates/smi",
  "crates/smi-core",
  "crates/smid",
  "crates/vis",
  "crates/vis-core",
  "crates/visd",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-nats = "0.39"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
